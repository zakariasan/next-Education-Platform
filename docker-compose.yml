# Local development database.
#
# The data lives in the NAMED volume `edu_platform_data`. That is the whole
# point of this file: a container created ad hoc with `docker run` and no -v
# flag gets an anonymous volume, and removing the container throws the data
# away. A named volume outlives `docker compose down` and any container
# rebuild.
#
#   docker compose up -d      start it
#   docker compose down       stop it, KEEPING the data
#   docker compose down -v    stop it and DELETE the data (never routine)
#
# Credentials come from .env, the same file Prisma reads.
services:
  db:
    image: postgres:16-alpine
    container_name: edu-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-edu_platform}
    ports:
      - "5433:5432"
    volumes:
      - edu_platform_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edu} -d ${POSTGRES_DB:-edu_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  edu_platform_data:
    external: true
